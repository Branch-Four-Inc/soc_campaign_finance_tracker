  .stat-grid {

}
.stat-card {

  display: flex;

  gap: clamp(12px, 2vw, 20px);
  min-height: 145px;
  padding: clamp(16px, 3vw, 28px) clamp(14px, 2.5vw, 24px);

  border: 1px solid #e5e7eb;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(15,23,42,.05);

}

.stat-icon{
 width:clamp(44px, 6vw, 62px);height:clamp(44px, 6vw, 62px);border-radius:50%;

 color:white;font-size:clamp(18px, 2.5vw, 28px);flex-shrink:0;z-index:2;
}
.stat-content{z-index:2; min-width: 0;}
.stat-label{
 font-size:clamp(11px, 1.4vw, 13px);font-weight:600;

}

.candidates .stat-label{color:#8f6ac8;}
.elections .stat-icon{background:linear-gradient(145deg,#e7a68d,#cf785d);}
.elections .stat-label{color:#cf785d;}
.stat-wave{ position:absolute; right:-20px; bottom:-25px; width:70%; height:90px; border-top:1px solid rgba(0,0,0,.15);
 border-radius:60% 0 0 0; opacity:.45;
}
  .filter-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }

    font-weight: 600;

  .candidate-row { display: grid; grid-template-columns: 1fr 160px 160px; padding: 14px 16px; align-items: center; border-bottom: 1px solid #e5e7eb; cursor: pointer; transition: background .15s; }

  .subtotal-row { display: grid; grid-template-columns: 1fr 160px 160px; padding: 10px 16px; font-size: 13px; border-top: 1px solid #e5e7eb; background: #f9fafb; }

function fmt(n) { return '$' + Number(n).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:0}); }
function initials(name) { return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const keys = lines[0].split(',').map(k => k.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = '', inQ = false;
    for (const ch of line) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    vals.push(cur.trim());
    return Object.fromEntries(keys.map((k,i) => [k, vals[i] ?? '']));
  });
}

let DATA = {};

async function loadAll() {
  const files = ['total_contributions','contributor_types','pac_contributors','corporate_contributors','top_contributors','instate_perc','all_state_perc'];
  const summaryFiles = ['total_contributions_by_election','most_pac_money','most_pac_share','most_corporate_money','most_corporate_share','most_out_state_money','most_out_state_share','most_union_share','widest_fundraising_gap','smallest_fundraising_gap'];
  const [paramsText, ...results] = await Promise.all([
    fetch('data_output/HUDSON COUNTY/parameters.csv').then(r => r.text()),
    ...files.map(f => fetch(`data_output/HUDSON COUNTY/${f}.csv`).then(r => r.text())),
    ...summaryFiles.map(f => fetch(`data_output/HUDSON COUNTY/summary_page/${f}.csv`).then(r => r.text()))
  ]);
  files.forEach((f, i) => DATA[f] = parseCSV(results[i]));
  summaryFiles.forEach((f, i) => SUMMARY_DATA[f] = parseCSV(results[files.length + i]));

  const params = parseCSV(paramsText)[0];
  DATA.params = params;

  document.title = `${params['Newsroom']}: Campaign Finance Tracker`;
  const sourceEl = document.getElementById('sidebar-source');
  sourceEl.textContent = `Data sourced from ${params['State']} Election Law Enforcement Commission.`;
  sourceEl.style.display = 'block';

  renderOverview();
  renderSummary();
}

function buildDollarCards() {
  const cards = [];
  const totals = DATA.total_contributions;

  // Most PAC Money
  const pacMoney = SUMMARY_DATA.most_pac_money;
  if (pacMoney && pacMoney.length) {
    const r = pacMoney[0];
    const cand = totals.find(t => t.CandidateID === r.CandidateID);
    const district = cand ? `${cand.Office} — ${cand.Location}` : '';
    cards.push({ label: 'Most PAC Money', candidate: r.Candidate, value: fmt(+r['Total Contributions']), sub: district });
  }

  // Most Corporate Money
  const corpMoney = SUMMARY_DATA.most_corporate_money;
  if (corpMoney && corpMoney.length) {
    const r = corpMoney[0];
    const cand = totals.find(t => t.CandidateID === r.CandidateID);
    const district = cand ? `${cand.Office} — ${cand.Location}` : '';
    cards.push({ label: 'Most Corporate Money', candidate: r.Candidate, value: fmt(+r['Total Contributions']), sub: district });
  }

  // Most Out-of-State Money
  const outMoney = SUMMARY_DATA.most_out_state_money;
  if (outMoney && outMoney.length) {
    const r = outMoney[0];
    const cand = totals.find(t => t.CandidateID === r.CandidateID);
    const district = cand ? `${cand.Office} — ${cand.Location}` : '';
    cards.push({ label: 'Most Out-of-State Money', candidate: r.Candidate, value: fmt(+r.Amount), sub: district });
  }

  // Most Grassroots Funded — find candidate with highest individual share (we derive from contributor_types)
  const indivByCand = {};
  DATA.contributor_types.forEach(r => {
    if (r['Contributor Type'] === 'Individual') {
      indivByCand[r.CandidateID] = +r['Total Contributions'];
    }
  });
  let bestGrassroots = null, bestGrassrootsAmt = 0;
  totals.forEach(c => {
    const indivAmt = indivByCand[c.CandidateID] || 0;
    if (indivAmt > bestGrassrootsAmt) {
      bestGrassrootsAmt = indivAmt;
      bestGrassroots = c;
    }
  });
  if (bestGrassroots) {
    cards.push({ label: 'Most Grassroots Funded', candidate: bestGrassroots.Candidate, value: fmt(bestGrassrootsAmt), sub: `${bestGrassroots.Office} — ${bestGrassroots.Location}` });
  }

  // Widest Fundraising Gap
  const widest = SUMMARY_DATA.widest_fundraising_gap;
  if (widest && widest.length) {
    const r = widest[0];
    const matchup = `${(r['Highest Candidate']||'').split('(')[0].trim()} vs. ${(r['Second Highest Candidate']||'').split('(')[0].trim()}`;
    cards.push({ label: 'Widest Fundraising Gap', candidate: `${r.Office} — ${r.Location}`, value: fmt(+r.Difference), sub: matchup });
  }

  // Tightest Fundraising Gap
  const smallest = SUMMARY_DATA.smallest_fundraising_gap;
  if (smallest && smallest.length) {
    const r = smallest[0];
    const matchup = `${(r['Highest Candidate']||'').split('(')[0].trim()} vs. ${(r['Second Highest Candidate']||'').split('(')[0].trim()}`;
    cards.push({ label: 'Tightest Fundraising Gap', candidate: `${r.Office} — ${r.Location}`, value: fmt(+r.Difference), sub: matchup });
  }

  // Top Overall Fundraiser
  const sorted = [...totals].sort((a,b) => +b['Total Contributions'] - +a['Total Contributions']);
  if (sorted.length) {
    const top = sorted[0];
    cards.push({ label: 'Top Overall Fundraiser', candidate: top.Candidate, value: fmt(+top['Total Contributions']), sub: `${top.Office} — ${top.Location}` });
  }

  return cards;
}

function buildShareCards() {
  const cards = [];

  // Highest PAC Share
  const pacShare = SUMMARY_DATA.most_pac_share;
  if (pacShare && pacShare.length) {
    const r = pacShare[0];
    cards.push({ label: 'Highest PAC Share', candidate: r.Candidate, value: Math.round(+r.share * 100) + '%', sub: 'of total raised' });
  }

  // Highest Corporate Share
  const corpShare = SUMMARY_DATA.most_corporate_share;
  if (corpShare && corpShare.length) {
    const r = corpShare[0];
    cards.push({ label: 'Highest Corporate Share', candidate: r.Candidate, value: Math.round(+r.share * 100) + '%', sub: 'of total raised' });
  }

  // Highest Out-of-State Share
  const outShare = SUMMARY_DATA.most_out_state_share;
  if (outShare && outShare.length) {
    const r = outShare[0];
    cards.push({ label: 'Highest Out-of-State Share', candidate: r.Candidate, value: Math.round(+r.share * 100) + '%', sub: 'of total raised' });
  }

  // Highest Union Share
  const unionShare = SUMMARY_DATA.most_union_share;
  if (unionShare && unionShare.length) {
    const r = unionShare[0];
    cards.push({ label: 'Highest Union Share', candidate: r.Candidate, value: Math.round(+r.share * 100) + '%', sub: 'of total raised' });
  }

  return cards;
}

function renderRaces() {
  const totals = DATA.total_contributions;
  const officeFilter = document.getElementById('office-filter').value;
  const locationFilter = document.getElementById('location-filter').value;

  const filtered = totals.filter(r =>
    (!officeFilter || r.Office === officeFilter) &&
    (!locationFilter || r.Location === locationFilter)
  );

  const byRace = {};
  filtered.forEach(r => {
    const key = `${r.Office} – ${r.Location}`;
    (byRace[key] = byRace[key] || []).push(r);
  });

  let racesHTML = '';
  Object.entries(byRace).forEach(([race, candidates], ri) => {
    const sorted = [...candidates].sort((a,b) => +b['Total Contributions'] - +a['Total Contributions']);
    const raceTotal = sorted.reduce((s,r) => s + +r['Total Contributions'], 0);
    let savedColor;
    let i = 0;

    const rows = sorted.map((c, ci) => {
      const pct = raceTotal ? Math.round(+c['Total Contributions'] / raceTotal * 100) : 0;
      const color = COLORS[(ri * 3 + ci) % COLORS.length];
      if(i == 0)
      {
        savedColor = color;
        i += 1;
      }
      return `<div class="candidate-row" data-id="${c.CandidateID}" data-name="${c.Candidate}">
        <div class="cand-info">
          <div class="avatar" style="background-color:${color};color:${'#fcfcfc'}">${initials(c.Candidate)}</div>
          <div class="cand-name">${c.Candidate}</div>
        </div>
        <div class="raised-col" style="color:${color}">${fmt(c['Total Contributions'])}</div>
        <div class="share-col">
          <div class="share-bar-bg"><div class="share-bar" style="width:${pct}%;background:${color}"></div></div>
          <span class="share-pct">${pct}%</span>
        </div>
      </div>`;
    }).join('');

    racesHTML += `<div class="race-section">

      <div class="race-badge" style="color:${savedColor}"> ${race}</div>
      <div class="candidate-table">
        <div class="table-header"><span>Candidate</span><span>Total Raised</span><span>Share of Election</span></div>
        ${rows}
        <div class="subtotal-row"><span>Election Total</span><span>${fmt(raceTotal)}</span><span></span></div>
      </div>
    </div>`;
  });

  document.getElementById('races-container').innerHTML = racesHTML || '<div class="empty">No results match the selected filters.</div>';

  document.querySelectorAll('.candidate-row').forEach(row => {

  const sorted = [...rows].sort(
    (a, b) =>
      Number(b["Total Contributions"]) -

      .trim()
      .toLowerCase()

      background: "#F3F4F6",
      text: "#6B7280"

    return `

}

// ── State abbreviation → FIPS lookup ──
const ABBR_TO_FIPS = {
  AL:'01',AK:'02',AZ:'04',AR:'05',CA:'06',CO:'08',CT:'09',DE:'10',DC:'11',FL:'12',
  GA:'13',HI:'15',ID:'16',IL:'17',IN:'18',IA:'19',KS:'20',KY:'21',LA:'22',ME:'23',
  MD:'24',MA:'25',MI:'26',MN:'27',MS:'28',MO:'29',MT:'30',NE:'31',NV:'32',NH:'33',
  NJ:'34',NM:'35',NY:'36',NC:'37',ND:'38',OH:'39',OK:'40',OR:'41',PA:'42',RI:'44',
  SC:'45',SD:'46',TN:'47',TX:'48',UT:'49',VT:'50',VA:'51',WA:'53',WV:'54',WI:'55',
  WY:'56',PR:'72'
};

// Cache TopoJSON so we only fetch it once
let _usTopoCache = null;
async function getUSTopo() {
  if (!_usTopoCache) {
    _usTopoCache = await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(r => r.json());
  }
  return _usTopoCache;
}

async function renderGeography(id, name) {
  const panel = document.getElementById('panel-geography');
  panel.innerHTML = '<div class="empty" style="padding:24px 0">Loading map…</div>';

  // ── In/out-of-state slider ──
  const instateRows = DATA.instate_perc.filter(r => r.CandidateID === id);
  const byLoc = {};
  instateRows.forEach(r => { byLoc[r['Contributor Location']] = +r.Amount || 0; });
  const inAmt  = byLoc['In-state']    || 0;
  const outAmt = byLoc['Out-of-state'] || 0;
  const undAmt = byLoc['Undisclosed']  || 0;
  const locTotal = inAmt + outAmt + undAmt;

  const pctIn  = locTotal ? (inAmt  / locTotal * 100) : 0;
  const pctOut = locTotal ? (outAmt / locTotal * 100) : 0;
  const pctUnd = locTotal ? (undAmt / locTotal * 100) : 0;

  const segStyle = (pct, color) =>
    pct >= 5
      ? `style="width:${pct.toFixed(1)}%;background:${color}"`
      : `style="width:${pct.toFixed(1)}%;background:${color};font-size:0"`;

  const sliderHTML = locTotal === 0
    ? '<div class="empty">No location data available.</div>'
    : `<div class="instate-bar-wrap">
        <div class="instate-bar-track">
          <div class="instate-bar-seg" ${segStyle(pctIn,  '#5d4f96')}>${pctIn.toFixed(0)}%</div>
          <div class="instate-bar-seg" ${segStyle(pctOut, '#c39051')}>${pctOut.toFixed(0)}%</div>
          <div class="instate-bar-seg" ${segStyle(pctUnd, '#ccc3c2')}>${pctUnd.toFixed(0)}%</div>
        </div>
        <div class="instate-legend">
          <div class="instate-legend-item">
            <div class="instate-legend-dot" style="background:#5d4f96"></div>
            In-state &nbsp;<span class="instate-legend-val">${fmt(inAmt)}</span>&nbsp;(${pctIn.toFixed(1)}%)
          </div>
          <div class="instate-legend-item">
            <div class="instate-legend-dot" style="background:#c59353"></div>
            Out-of-state &nbsp;<span class="instate-legend-val">${fmt(outAmt)}</span>&nbsp;(${pctOut.toFixed(1)}%)
          </div>
          ${undAmt > 0 ? `<div class="instate-legend-item">
            <div class="instate-legend-dot" style="background:#d1d5db"></div>
            Undisclosed &nbsp;<span class="instate-legend-val">${fmt(undAmt)}</span>&nbsp;(${pctUnd.toFixed(1)}%)
          </div>` : ''}
        </div>
      </div>`;

  // ── Choropleth map ──
  const stateRows = DATA.all_state_perc.filter(r => r.CandidateID === id);
  const byState = {};
  stateRows.forEach(r => { byState[r.State] = +r.Amount || 0; });

  const amounts = Object.values(byState).filter(v => v > 0);
  const maxAmt  = amounts.length ? Math.max(...amounts) : 1;

  // 5-step threshold based on max value
  const step = maxAmt / 5;
  const thresholds = [step, step*2, step*3, step*4];
  const BLUE = ['#eae3ef','#e2d9eb','#b69bd2','#9475b9','#4c3883'];
  const GRAY  = '#f3f4f6';

  const colorScale = (v) => {
    if (!v) return GRAY;
    for (let i = 0; i < thresholds.length; i++) {
      if (v <= thresholds[i]) return BLUE[i];
    }
    return BLUE[4];
  };

  const legendHTML = BLUE.map((c, i) => `
    <div class="geo-map-legend-item">
      <div class="geo-map-legend-swatch" style="background:${c}"></div>
      ${i === BLUE.length - 1
        ? `&ge; ${fmt(thresholds[i-1])}`
        : `${fmt(i === 0 ? 0 : thresholds[i-1])} – ${fmt(thresholds[i])}`}
    </div>`).join('');

  panel.innerHTML = `
    <div class="geo-section">
      <div class="geo-section-title">In-state vs. Out-of-state</div>
      ${sliderHTML}
    </div>
    <div class="geo-section">
      <div class="geo-section-title">Contributions by State</div>
      <div class="geo-map-wrap">
        <div class="geo-map-legend">${legendHTML}</div>
        <svg id="geo-svg" viewBox="0 0 960 600"></svg>
      </div>
    </div>`;

  // Draw map with D3
  try {
    const us = await getUSTopo();
    const states = topojson.feature(us, us.objects.states);

    // Build fips→amount map
    const amtByFips = {};
    Object.entries(byState).forEach(([abbr, amt]) => {
      const fips = ABBR_TO_FIPS[abbr];
      if (fips) amtByFips[fips] = amt;
    });

    // Reverse lookup FIPS→abbreviation for tooltip
    const fipsToAbbr = {};
    Object.entries(ABBR_TO_FIPS).forEach(([a, f]) => fipsToAbbr[f] = a);

    // Use albersUsa — matches the us-atlas coordinate space exactly
    const W = 960, H = 600;
    const projection = d3.geoAlbersUsa().scale(1300).translate([W/2, H/2]);
    const path = d3.geoPath().projection(projection);
    const tip  = document.getElementById('geo-tooltip');

    const svg = d3.select('#geo-svg')
      .attr('viewBox', `0 0 ${W} ${H}`)
      .attr('width', '100%')
      .attr('height', 'auto');

    svg.selectAll('path')
      .data(states.features)
      .join('path')
      .attr('d', path)
      .attr('fill', d => {
        const fips = String(d.id).padStart(2,'0');
        return colorScale(amtByFips[fips] || 0);
      })
      .on('mousemove', function(event, d) {
        const fips = String(d.id).padStart(2,'0');
        const abbr = fipsToAbbr[fips] || '';
        const amt  = amtByFips[fips]  || 0;
        tip.style.display = 'block';
        tip.style.left    = (event.clientX + 12) + 'px';
        tip.style.top     = (event.clientY - 28) + 'px';
        tip.textContent   = amt ? `${abbr}: ${fmt(amt)}` : `${abbr}: $0`;
      })
      .on('mouseleave', () => { tip.style.display = 'none'; });

    // State abbreviation labels — only render if centroid is within the projection
    svg.selectAll('text')
      .data(states.features)
      .join('text')
      .each(function(d) {
        const c = projection(d3.geoCentroid(d));
        if (!c) { d3.select(this).remove(); return; }
        d3.select(this)
          .attr('x', c[0])
          .attr('y', c[1])
          .attr('text-anchor', 'middle')
          .attr('dominant-baseline', 'central')
          .attr('font-size', '8')
          .attr('font-family', '-apple-system, BlinkMacSystemFont, sans-serif')
          .attr('fill', '#aca3c4')
          .attr('pointer-events', 'none')
          .text(fipsToAbbr[String(d.id).padStart(2,'0')] || '');
      });
  } catch(e) {
    document.querySelector('#panel-geography .geo-map-wrap').insertAdjacentHTML(
      'beforeend', '<div class="empty" style="margin-top:8px">Map unavailable (network error).</div>'
    );
  }
}

loadAll();
</script>
